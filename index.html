<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YOLO GALLERY</title>
    <!-- 关联 CSS 文件 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- 顶部标题 -->
    <header>
        <h1>YOLO26 GALLERY</h1>
    </header>

    <main class="container">
        <!-- 上传区域 -->
        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*">
            <button id="uploadBtn">开始识别</button>
        </div>

        <!-- 图像显示区域 -->
        <div class="display-area">
            <div class="image-card">
                <h3>原始图片</h3>
                <div class="window" id="originalWindow">
                    <img id="originalImg" src="" alt="等待上传...">
                </div>
            </div>

            <div class="image-card">
                <h3>识别结果</h3>
                <div class="window" id="resultWindow">
                    <img id="resultImg" src="" alt="等待识别...">
                </div>
            </div>
        </div>
    </main>

</body>
<script>
    const imageInput = document.getElementById('imageInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const originalImg = document.getElementById('originalImg');
    const resultImg = document.getElementById('resultImg');

    // 1. 预览本地图片
    imageInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) originalImg.src = URL.createObjectURL(file);
    };

    // 2. 上传并识别
    uploadBtn.onclick = async () => {
        const file = imageInput.files[0];
        if (!file) return alert("请先选择图片");

        const formData = new FormData();
        formData.append("file", file);

        uploadBtn.innerText = "识别中...";

        // 发送给后端
        const response = await fetch("/predict", { method: "POST", body: formData });
        const data = await response.json();

        // 显示结果（加时间戳防止浏览器缓存不刷新图片）
        resultImg.src = data.result_path + "?t=" + new Date().getTime();
        uploadBtn.innerText = "开始识别";
    };
</script>
</html>
